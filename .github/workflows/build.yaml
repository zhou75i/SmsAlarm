name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Release APK
      run: gradle assembleRelease

    # 【核心改变】：抛弃废弃插件，直接调用安卓官方原生工具手动签名！极其稳定！
    - name: Sign APK Natively
      env:
        KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # 1. 从保险箱还原你的数字身份证 (Keystore)
        echo "$KEYSTORE" | base64 --decode > myapp.jks
        
        # 2. 自动寻找系统里最新版本的 Android Build Tools
        BUILD_TOOL=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        
        # 3. 对齐 APK 文件（安卓系统强制要求的高级内存优化步骤）
        $BUILD_TOOL/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        
        # 4. 使用你的身份证为 APK 盖章正式签名
        $BUILD_TOOL/apksigner sign --ks myapp.jks --ks-pass pass:123456 --ks-key-alias myalias --key-pass pass:123456 --out app-release-signed.apk app-release-aligned.apk

    # 将签好名的最终成品提取出来供你下载
    - name: Upload Official APK
      uses: actions/upload-artifact@v4
      with:
        name: SmsAlarm-V1.4-Official
        path: app-release-signed.apk
